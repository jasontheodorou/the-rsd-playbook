<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&display=swap" />
    <title>The RSD Playbook</title>
    <meta name="description" content="Practice foundations, module by module." />

    <!-- Link previews (Slack, Teams, LinkedIn, iMessage). %SITE_URL% is injected
         at build time by the og-url plugin in vite.config.ts. Regenerate the
         image with `npm run og` after changing the title or tagline. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Transform" />
    <meta property="og:title" content="The RSD Playbook" />
    <meta property="og:description" content="Practice foundations, module by module." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The RSD Playbook" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
